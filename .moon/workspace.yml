$schema: "https://moonrepo.dev/schemas/workspace.json"

# Glob-based discovery. Onboarding a project = mkdir + moon.yml; no
# edit here. Projects hash independently — a Ghostty color change does
# not invalidate the Go binary cache.
projects:
  globs:
    - "apps/*"
    - "modules"
  sources:
    root: "."

vcs:
  client: "git"
  defaultBranch: "main"
  # Hooks are Moon tasks executed through the canonical Nix dev shell.
  # The wrapper is a no-op when direnv already activated this checkout;
  # otherwise it enters `nix develop` so hooks never depend on host-global
  # copies of treefmt, Go, or the linters. The verdict still uses Moon's
  # content-hash cache. `--affected --status=staged` filters to projects
  # whose declared inputs intersect the staged set.
  hooks:
    pre-commit:
      - "./scripts/run-in-dev-shell.sh moon run root:fmt --affected --status=staged"
    pre-push:
      # One invocation, multiple selectors: Moon parallelizes targets
      # within a single run, saving the second startup + project-graph
      # hydration. With --affected, leaf tasks whose scoped inputs
      # don't intersect the changed files become cache hits — a Go-only
      # push skips the Nix/Actions linters, a docs-only push skips Go.
      - "./scripts/run-in-dev-shell.sh moon run '#go:lint' '#go:test' root:lint --affected"
  sync: true

# `pipeline` was `runner` before moon v2 (the block was renamed in the
# "Phobos" release); the cache + color knobs are unchanged.
pipeline:
  cacheLifetime: "7 days"
  inheritColorsForPipedTasks: true

telemetry: false
