$schema: "https://moonrepo.dev/schemas/workspace.json"

# Glob-based discovery. Onboarding a project = mkdir + moon.yml; no
# edit here. Projects hash independently — a Ghostty color change does
# not invalidate the Go binary cache.
projects:
  globs:
    - "apps/*"
    - "libs/*"
    - "modules"
  sources:
    root: "."

vcs:
  manager: "git"
  defaultBranch: "main"
  # Hooks are Moon tasks. Both shell out to `moon run`, so the verdict
  # uses the same content-hash cache as a regular task. `--affected
  # --status=staged` filters to projects whose declared inputs intersect
  # the staged set — unchanged projects are a cache hit, not a re-run.
  hooks:
    pre-commit:
      - "moon run root:fmt --affected --status=staged"
    pre-push:
      # One invocation, two tag selectors: Moon parallelizes targets
      # within a single run, saving the second startup + project-graph
      # hydration. A future modules:lint won't be picked up by `#go:*`.
      - "moon run '#go:lint' '#go:test' --affected"
  syncHooks: true

runner:
  cacheLifetime: "7 days"
  inheritColorsForPipedTasks: true

telemetry: false
