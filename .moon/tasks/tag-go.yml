$schema: "https://moonrepo.dev/schemas/tasks.json"

fileGroups:
  go-sources:
    - "**/*.go"

tasks:
  tidy:
    command: "go mod tidy"
    inputs:
      - "go.mod"
      - "go.sum"
    options:
      cache: false

  lint:
    command: "go vet ./..."
    inputs:
      - "@globs(go-sources)"
      - "go.mod"
      - "go.sum"
    outputs: []

  test:
    command: "go test ./..."
    inputs:
      - "@globs(go-sources)"
      - "go.mod"
      - "go.sum"
    outputs: []

  # Binary name defaults to the project directory's basename. Projects
  # whose binary differs (apps/cli ships as `dots`) override via
  # `env: { BIN_NAME: <name> }` and a matching `outputs:` entry — no
  # `args` override required, no mergeArgs strategy to remember.
  build:
    command: "bash"
    args:
      - "-c"
      - 'go build -trimpath -ldflags="-s -w" -o "bin/${BIN_NAME:-$(basename "$PWD")}" .'
    inputs:
      - "@globs(go-sources)"
      - "go.mod"
      - "go.sum"
    outputs:
      - "bin/*"
