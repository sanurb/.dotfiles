# GoReleaser config for `dots`.
# Spec: GoReleaser v2 (schema unchanged from v1.26+; v2 just removed deprecated keys).
# Run `goreleaser check` after edits.

version: 2

project_name: dots

# `go mod tidy` is intentionally NOT a release hook — go.sum drift should
# fail in CI/pre-commit, not at release time. By the time we tag, the
# module graph is already canonical.

builds:
  - id: dots
    main: ./
    dir: ./apps/cli
    binary: dots
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Versioned tar.gz archive — preserved for the Homebrew cask and
  # for users who want LICENSE/README alongside the binary.
  - id: dots
    ids: [dots]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
  # Raw binary, stable filename — the curl-install path resolves
  #   /releases/latest/download/dots-{darwin,linux}-{amd64,arm64}
  # without a version segment. Cosign + SBOM coverage is automatic
  # because signs/sboms below match `artifacts: archive`, which fires
  # on every archives entry regardless of format.
  - id: dots-binary
    ids: [dots]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    formats: [binary]

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

# cosign keyless signing using GitHub OIDC. Requires `id-token: write` on the
# release workflow. Each archive and the checksum file gets a `.sig` and a
# `.pem` (Sigstore Fulcio cert).
signs:
  - id: archives
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: archive
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum

# CycloneDX SBOM per archive via syft.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"
    cmd: syft
    args:
      - "$artifact"
      - --output
      - cyclonedx-json=$document

# Homebrew tap. Requires HOMEBREW_TAP_TOKEN secret on the release workflow
# (a fine-grained PAT with contents:write on sanurb/homebrew-tap).
#
# GoReleaser deprecated pre-built binary formulas in v2.16. Casks are the
# supported replacement for both Homebrew and Linuxbrew. The macOS hook is
# required until dots is Apple-notarized: Homebrew quarantines cask downloads,
# while the release's cosign signature is not an Apple Gatekeeper signature.
homebrew_casks:
  - name: dots
    ids: [dots]
    binaries: [dots]
    repository:
      owner: sanurb
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    commit_msg_template: "dots: bump to {{ .Tag }}"
    homepage: "https://github.com/sanurb/.dotfiles"
    description: "Interactive frontend for the Nix-managed dotfiles environment."
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dots"]
          end

release:
  github:
    owner: sanurb
    name: .dotfiles
  prerelease: auto
  draft: false
  mode: replace
  header: |
    ## dots {{ .Tag }}

    Pre-built binaries for macOS and Linux (amd64, arm64).

  footer: |
    ## Verifying the release

    Every artifact (raw binary, tar.gz archive, SHA256SUMS) is signed with
    [cosign](https://docs.sigstore.dev/) using keyless OIDC — no managed
    keys; the certificate identity is the GitHub Actions workflow. To
    verify a download:

    ```sh
    # 1. Verify the checksum file's signature (covers every artifact below).
    cosign verify-blob \
      --certificate-identity-regexp "https://github.com/sanurb/.dotfiles" \
      --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      --certificate SHA256SUMS.pem \
      --signature SHA256SUMS.sig \
      SHA256SUMS

    # 2a. Raw binary (curl-install path):
    grep "dots-${OS}-${ARCH}" SHA256SUMS | shasum -a 256 -c -

    # 2b. Versioned tar.gz (Homebrew / manual archive grab):
    grep "dots_${VERSION}_${OS}_${ARCH}.tar.gz" SHA256SUMS | shasum -a 256 -c -
    ```

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"
