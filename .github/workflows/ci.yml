name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flake-check:
    name: flake check (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Seed devenv-root
        run: echo "$PWD" > .devenv-root

      - name: Run flake checks
        run: nix flake check --impure --accept-flake-config --print-build-logs

  cli-quality:
    name: cli quality (vet, test, fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Seed devenv-root
        run: echo "$PWD" > .devenv-root

      - name: vet · test · treefmt
        run: |
          nix develop --impure --accept-flake-config \
            --override-input devenv-root "file+file://$PWD/.devenv-root" \
            -c sh -eu -c '
              go vet ./apps/cli/...
              go test ./apps/cli/...
              treefmt --fail-on-change
            '

  renovate-config:
    name: renovate config
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Renovate config
        uses: suzuki-shunsuke/github-action-renovate-config-validator@c22827f47f4f4a5364bdba19e1fe36907ef1318e # v1.1.1

  commit-lint:
    name: commit lint
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -eu
          pattern='^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-zA-Z0-9._/-]+\))?!?:[[:space:]].+'
          fail=0
          while IFS=' ' read -r sha subject; do
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::commit ${sha:0:12} does not follow Conventional Commits"
              echo "  subject: $subject"
              fail=1
            fi
          done < <(git log --no-merges --format='%H %s' "${BASE_SHA}..${HEAD_SHA}")

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Expected: <type>(<scope>): <subject>"
            echo "Types:    feat | fix | chore | docs | style | refactor | perf | test | build | ci | revert"
            exit 1
          fi
