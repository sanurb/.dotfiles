name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flake-check:
    name: flake check (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Seed devenv-root
        run: echo "$PWD" > .devenv-root

      - name: Run flake checks
        run: nix flake check --impure --accept-flake-config --print-build-logs

  repo-lint:
    name: repo lint (actions, nix)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # Full history so `git merge-base origin/main HEAD` can reach the
          # branch point. moon v2 resolves a base revision from the CI PR
          # context (GITHUB_BASE_REF) on `moon run` and diffs against it;
          # a shallow checkout has no common ancestor and it aborts.
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Seed devenv-root
        run: echo "$PWD" > .devenv-root

      # moon v2 diffs against `main` to compute touched files; the PR
      # checkout has neither a local `main` nor `origin/main`. Materialize
      # the remote-tracking ref so moon's `origin/main` fallback resolves.
      - name: Provide base branch for moon
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: actionlint · zizmor · pinact · deadnix · statix
        # pinact resolves each pinned SHA back to its tag through the
        # GitHub API. Unauthenticated, that shares the runner pool's IP
        # rate limit, and the exhausted request surfaces as the opaque
        # "list tags: context canceled" rather than a 403 — which is why
        # this job went red without any workflow change. The default
        # read-only GITHUB_TOKEN is enough to get a per-repo quota.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix develop --impure --accept-flake-config \
            --override-input devenv-root "file+file://$PWD/.devenv-root" \
            -c moon run root:lint

  cli-quality:
    name: cli quality (vet, test, fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Seed devenv-root
        run: echo "$PWD" > .devenv-root

      - name: vet · test · treefmt
        run: |
          nix develop --impure --accept-flake-config \
            --override-input devenv-root "file+file://$PWD/.devenv-root" \
            -c sh -eu -c '
              go vet ./apps/cli/...
              go test ./apps/cli/...
              treefmt --fail-on-change
            '

  renovate-config:
    name: renovate config
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Renovate config
        uses: suzuki-shunsuke/github-action-renovate-config-validator@c22827f47f4f4a5364bdba19e1fe36907ef1318e # v1.1.1

  commit-lint:
    name: commit lint
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -eu
          pattern='^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-zA-Z0-9._/-]+\))?!?:[[:space:]].+'
          fail=0
          while IFS=' ' read -r sha subject; do
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::commit ${sha:0:12} does not follow Conventional Commits"
              echo "  subject: $subject"
              fail=1
            fi
          done < <(git log --no-merges --format='%H %s' "${BASE_SHA}..${HEAD_SHA}")

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Expected: <type>(<scope>): <subject>"
            echo "Types:    feat | fix | chore | docs | style | refactor | perf | test | build | ci | revert"
            exit 1
          fi
