# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: commit-lint

# Per-commit Conventional Commits gate. Enforces the commit-message
# discipline that lets `git bisect` between any two tags land on a
# single semantic change — the v0.4.8 lesson where a build-blocker fix
# was bundled with five unrelated home-manager option renames.
#
# Inline shell rather than commitlint/wagoid: the regex is short, the
# accepted prefixes are the same set GoReleaser's changelog config
# already filters on (.goreleaser.yaml), and adding a Node toolchain
# for one regex would be tech debt. If the rules grow past what a
# regex can express, swap in a real linter.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base..head log range is reachable.
          fetch-depth: 0

      - name: Lint commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # Conventional Commits 1.0:
          #   <type>[optional scope][!]: <description>
          # Types match GoReleaser's changelog regex set so a green
          # commit-lint run guarantees a clean release changelog.
          pattern='^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-zA-Z0-9._/-]+\))?!?:[[:space:]].+'
          fail=0
          while IFS=' ' read -r sha subject; do
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::commit ${sha:0:12} does not follow Conventional Commits"
              echo "  subject: $subject"
              fail=1
            fi
          done < <(git log --no-merges --format='%H %s' "${BASE_SHA}..${HEAD_SHA}")

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Expected: <type>(<scope>): <subject>"
            echo "Types:    feat | fix | chore | docs | style | refactor | perf | test | build | ci | revert"
            echo "Examples: fix(apply): drop the standalone branch"
            echo "          chore(deps): bump flake.lock"
            exit 1
          fi
