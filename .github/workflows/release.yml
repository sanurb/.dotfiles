name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        # cache: false on the release path is deliberate. zizmor flags
        # the default cache-on for release workflows as a cache-poisoning
        # vector: a PR could populate the actions cache with malicious
        # build artifacts that a later tag-triggered release picks up.
        # The release pipeline runs rarely, the dependency graph is
        # small, and immutable tag refs deserve the determinism premium.
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: apps/cli/go.mod
          cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Initialize cosign
        run: cosign initialize

      # Truthy check, not `!= ''`: an unset GitHub Actions variable
      # evaluates to null, and `null != ''` is TRUE in expression
      # syntax, which lets the step run with an empty client-id and
      # crashes inside the action. `${{ vars.X }}` is falsy for both
      # unset and empty, which is what we want.
      - name: Mint Homebrew tap token
        id: tap-token
        if: ${{ vars.HOMEBREW_TAP_CLIENT_ID }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: sanurb
          repositories: homebrew-tap
          # Without an explicit permission-* input the minted token
          # inherits every permission the App installation was granted
          # (zizmor `github-app`, high). GoReleaser only commits
          # Formula/dots.rb to the tap, so contents is the whole need.
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          # Mirror the gate above: skip homebrew unless the App is
          # configured. Negated truthy check, same semantics.
          args: release --clean --parallelism=1 ${{ !vars.HOMEBREW_TAP_CLIENT_ID && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}

      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.sbom.json
