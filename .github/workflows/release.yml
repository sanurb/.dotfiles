name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # cosign keyless OIDC
  packages: write   # future-proof if we publish containers

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser needs full history for the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache: true
          cache-dependency-path: apps/cli/go.sum

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.17.7

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on sanurb/homebrew-tap. The default
          # GITHUB_TOKEN cannot push to a separate repo, so this must be
          # configured before the first tagged release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Disable cosign's TUF root cache. GoReleaser invokes `cosign
          # sign-blob` in parallel for multiple artifacts; they race on
          # the cache flock and one fails with "creating cached local
          # store: resource temporarily unavailable". Bypassing the
          # cache costs an extra TUF fetch per sign (~hundreds of ms)
          # in exchange for deterministic parallelism.
          SIGSTORE_NO_CACHE: "true"
