name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        # cache: false on the release path is deliberate. zizmor flags
        # the default cache-on for release workflows as a cache-poisoning
        # vector: a PR could populate the actions cache with malicious
        # build artifacts that a later tag-triggered release picks up.
        # The release pipeline runs rarely, the dependency graph is
        # small, and immutable tag refs deserve the determinism premium.
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: apps/cli/go.mod
          cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: v2.6.3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Initialize cosign
        run: cosign initialize

      # Truthy check, not `!= ''`: an unset GitHub Actions variable
      # evaluates to null, and `null != ''` is TRUE in expression
      # syntax, which lets the step run with an empty client-id and
      # crashes inside the action. `${{ vars.X }}` is falsy for both
      # unset and empty, which is what we want.
      - name: Mint Homebrew tap token
        id: tap-token
        if: ${{ vars.HOMEBREW_TAP_CLIENT_ID }}
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.HOMEBREW_TAP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: sanurb
          repositories: homebrew-tap

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          # Mirror the gate above: skip homebrew unless the App is
          # configured. Negated truthy check, same semantics.
          args: release --clean --parallelism=1 ${{ !vars.HOMEBREW_TAP_CLIENT_ID && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}

      - name: Generate build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.sbom.json
