name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # cosign keyless OIDC
  packages: write   # future-proof if we publish containers

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser needs full history for the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache: true
          cache-dependency-path: apps/cli/go.sum

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.17.7

      # Pre-warm the cosign TUF root cache. Without this, parallel
      # `cosign sign-blob` calls race on creating ~/.sigstore/root and
      # one fails with "creating cached local store: resource
      # temporarily unavailable". A single `initialize` populates the
      # cache once; subsequent calls just read it.
      - name: Initialize cosign
        run: cosign initialize

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # `--parallelism=1` serializes the signing pipe. Sigstore's
          # Fulcio occasionally drops HTTP/2 streams under burst load
          # from a single client; serializing trades ~30s of release
          # wall time for deterministic signing against transient
          # peer-side stream errors.
          args: release --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on sanurb/homebrew-tap. The default
          # GITHUB_TOKEN cannot push to a separate repo, so this must be
          # configured before the first tagged release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
