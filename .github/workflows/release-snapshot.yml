# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: release-snapshot

# Validates the GoReleaser config on every PR by running a full snapshot
# build (no publish, no sign). Catches build/archive/template breakage
# before a real tag turns into an aborted release.

on:
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".goreleaser.yml"
      - "apps/cli/**"
      - ".github/workflows/release-snapshot.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache: true
          cache-dependency-path: apps/cli/go.sum

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.17.7

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # Skip publish + sign — snapshots have no OIDC and no token.
          args: release --snapshot --clean --skip=publish,sign

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-snapshot
          path: dist/
          retention-days: 7
