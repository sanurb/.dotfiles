# Starship — projected read-only into ~/.config/starship.toml by
# modules/starship.nix. Single line, low input latency, no async network
# calls. Optimized for sub-10ms render budget.

format = """
$directory\
$git_branch\
$git_status\
$nix_shell\
$cmd_duration\
$line_break\
$character"""

add_newline = false
command_timeout = 200

[character]
success_symbol = "[›](bold green)"
error_symbol   = "[›](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold magenta"
truncation_length = 32

[git_status]
style = "yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "="
modified = "!"
staged = "+"
untracked = "?"

[nix_shell]
disabled = false
format = "via [$symbol$state]($style) "
symbol = "❄ "
style = "bold blue"

[cmd_duration]
min_time = 1500
format = "[$duration]($style) "
style = "dimmed yellow"
