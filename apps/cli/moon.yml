$schema: "https://moonrepo.dev/schemas/project.json"

layer: application
language: go
tags:
  - go

project:
  title: cli
  description: "dots — interactive workspace frontend."

# tidy / lint / test / build inherit from .moon/tasks/tag-go.yml.
tasks:
  build:
    env:
      BIN_NAME: "dots"
    outputs:
      - "bin/dots"
    options:
      mergeOutputs: "replace"

  run:
    command: "go run ."
    options:
      # v2 dropped `local: true`; `runInCI: false` is the faithful
      # replacement (keeps it out of `moon ci`, no persistent preset).
      runInCI: false
      cache: false

  # CI gate — binary health only. `--binary-only` skips persona checks
  # (atuin/zoxide/starship/state file) which require an activated Home
  # Manager. CI runs on fresh hosts; without the split, this gate fails
  # forever on every new runner.
  check:
    command: "./bin/dots doctor --binary-only"
    deps:
      - "~:build"
    inputs:
      - "/.prototools"
      - "/devenv.nix"
    options:
      cache: false

  # Deploy gate — full doctor including persona. `runInCI: false` keeps
  # it out of `moon ci` because it asserts host realization, not binary
  # health. modules:deploy depends on this task, not on cli:check.
  # (`runInCI: false` replaces v1's `local: true`, removed in moon v2.)
  doctor:
    command: "./bin/dots doctor"
    deps:
      - "~:build"
    inputs:
      - "/.prototools"
      - "/devenv.nix"
    options:
      runInCI: false
      cache: false
