$schema: "https://moonrepo.dev/schemas/project.json"

type: application
language: go
tags:
  - go

project:
  name: cli
  description: "dots — interactive workspace frontend."

# tidy / lint / test / build inherit from .moon/tasks/tag-go.yml.
tasks:
  build:
    env:
      BIN_NAME: "dots"
    outputs:
      - "bin/dots"
    options:
      mergeOutputs: "replace"

  run:
    command: "go run ."
    local: true
    options:
      cache: false

  # CI gate — binary health only. `--binary-only` skips persona checks
  # (atuin/zoxide/starship/state file) which require an activated Home
  # Manager. CI runs on fresh hosts; without the split, this gate fails
  # forever on every new runner.
  check:
    command: "./bin/dots doctor --binary-only"
    deps:
      - "~:build"
    inputs:
      - "/.prototools"
      - "/devenv.nix"
    options:
      cache: false

  # Deploy gate — full doctor including persona. `local: true` keeps it
  # out of `moon ci` because it asserts host realization, not binary
  # health. modules:deploy depends on this task, not on cli:check.
  doctor:
    command: "./bin/dots doctor"
    deps:
      - "~:build"
    inputs:
      - "/.prototools"
      - "/devenv.nix"
    local: true
    options:
      cache: false
