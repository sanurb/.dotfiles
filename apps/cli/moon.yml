$schema: "https://moonrepo.dev/schemas/project.json"

type: application
language: go
tags:
  - go

project:
  name: cli
  description: "dots — interactive workspace frontend."

# tidy / lint / test / build inherit from .moon/tasks/tag-go.yml.
tasks:
  build:
    env:
      BIN_NAME: "dots"
    outputs:
      - "bin/dots"
    options:
      mergeOutputs: "replace"

  run:
    command: "go run ."
    local: true
    options:
      cache: false

  # Workspace health gate — built binary runs the doctor against the
  # declared toolchain. NOT `local: true`: this is a CI gate AND the
  # deploy precondition (modules:deploy depends on it).
  check:
    command: "./bin/dots doctor"
    deps:
      - "~:build"
    inputs:
      - "/.prototools"
      - "/devenv.nix"
    options:
      cache: false
