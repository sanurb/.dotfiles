$schema: "https://moonrepo.dev/schemas/project.json"

# Workspace-root project. Owns tasks whose inputs cross project
# boundaries (treefmt, repo-wide gates) — anchored at "." so a single
# hash key covers every formattable file.
type: tool
language: bash

project:
  name: root
  description: "Workspace-root tasks (formatting, repo-wide gates)."

tasks:
  # Canonical formatter — treefmt wraps gofumpt (Go) + nixpkgs-fmt (Nix)
  # via devenv.nix. `--fail-on-change` makes this both formatter and
  # lint-clean assertion; CI and `dots doctor` consume the exit code.
  fmt:
    command: "treefmt"
    args:
      - "--fail-on-change"
    inputs:
      - "**/*.go"
      - "**/*.nix"
      - "/devenv.nix"
      - "/flake.nix"
    options:
      cache: true
