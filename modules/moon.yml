$schema: "https://moonrepo.dev/schemas/project.json"

type: configuration
language: bash

project:
  name: modules
  description: "Home Manager projection."

tasks:
  check:
    command: "nix flake check --impure --accept-flake-config"
    inputs:
      - "@globs(configs)"
      - "/flake.nix"
      - "/flake.lock"
      - "/devenv.nix"
    options:
      runFromWorkspaceRoot: true

  # Hard gate: cli:check (the Go doctor) must pass before activation —
  # the enforcement clause of "Declare, Don't Script."
  #
  # Flake-ref shape: pass the configuration name via `-c <name> .`, NOT
  # `.#homeConfigurations.<name>`. The latter short-circuits nh's
  # resolver and skips the `.config.home.activationPackage` suffix, so
  # `nix build` resolves the homeManagerConfiguration record (a set)
  # and trips the flake schema check on `homeConfigurations.<name>.type`.
  # The `-c` form goes through auto-detect, which appends the suffix.
  # flake.nix keys homeConfigurations by <system>; we resolve at deploy
  # time via `nix eval --impure`.
  #
  # `--impure --accept-flake-config` forwards to `nix build` via nh's
  # `--` passthrough so home.nix can read MOON_WORKSPACE_ROOT and the
  # .dots-state.toml outside the flake source filter.
  # NH_SHOW_ACTIVATION_LOGS=1 keeps activation diagnostics visible
  # (nh >=4.3.0 hides them by default).
  deploy:
    command: "bash"
    args:
      - "-c"
      - |-
        export NH_SHOW_ACTIVATION_LOGS=1
        sys="$(nix eval --raw --impure --expr 'builtins.currentSystem')"
        exec nh home switch -c "${sys}" . -- \
          --impure --accept-flake-config
    deps:
      - "cli:check"
    local: true
    options:
      cache: false
      runFromWorkspaceRoot: true

  backup:
    command: "bash scripts/backup.sh"
    inputs:
      - "scripts/backup.sh"
    local: true
    options:
      cache: false

  update:
    command: "nix flake update"
    local: true
    options:
      cache: false
      runFromWorkspaceRoot: true
