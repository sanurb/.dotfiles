$schema: "https://moonrepo.dev/schemas/project.json"

type: configuration
language: bash

project:
  name: modules
  description: "Home Manager projection."

# The activation path (dots apply → nh home switch) is dots-direct;
# moon's only role here is the dev-side flake checks and the input-
# update helper below. A previous modules:deploy task ran nh through
# moon's argv interpolator, which silently rewrote bash-local $VARs
# in the script body — the script was moved into the Go binary and
# the moon layer dropped.
tasks:
  check:
    command: "nix flake check --impure --accept-flake-config"
    inputs:
      - "@globs(configs)"
      - "/flake.nix"
      - "/flake.lock"
      - "/devenv.nix"
    options:
      runFromWorkspaceRoot: true

  update:
    command: "nix flake update"
    local: true
    options:
      cache: false
      runFromWorkspaceRoot: true
