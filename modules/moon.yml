$schema: "https://moonrepo.dev/schemas/project.json"

type: configuration
language: bash

project:
  name: modules
  description: "Home Manager projection."

tasks:
  check:
    command: "nix flake check --impure --accept-flake-config"
    inputs:
      - "@globs(configs)"
      - "/flake.nix"
      - "/flake.lock"
      - "/devenv.nix"
    options:
      runFromWorkspaceRoot: true

  # Hard gate: cli:doctor (full host probe — persona + binaries) must
  # pass before activation. The lighter cli:check is for CI; deploys
  # mutate $HOME and earn the heavier check.
  #
  # Flake-ref shape: pass the configuration name via `-c <name> .`, NOT
  # `.#homeConfigurations.<name>`. The latter short-circuits nh's
  # resolver and skips the `.config.home.activationPackage` suffix, so
  # `nix build` resolves the homeManagerConfiguration record (a set)
  # and trips the flake schema check on `homeConfigurations.<name>.type`.
  # The `-c` form goes through auto-detect, which appends the suffix.
  # flake.nix keys homeConfigurations by <system>.
  #
  # System resolution: `dots apply` pre-computes `DOTS_NIX_SYSTEM` from
  # runtime.GOOS/GOARCH (see apps/cli/cmd_apply.go::nixSystem) and sets
  # it in the moon subprocess env. We use it directly. The nix-eval
  # fallback handles direct `moon run modules:deploy` invocations from
  # an activated dev shell. v0.4.3 hit a bug where command substitution
  # silently swallowed a failed `nix eval`, leaving sys="" and feeding
  # nh an empty -c value — sidestepping the eval entirely is the fix.
  #
  # `--impure --accept-flake-config` forwards to `nix build` via nh's
  # `--` passthrough so home.nix can read MOON_WORKSPACE_ROOT and the
  # .dots-state.toml outside the flake source filter.
  # NH_SHOW_ACTIVATION_LOGS=1 keeps activation diagnostics visible
  # (nh >=4.3.0 hides them by default).
  deploy:
    command: "bash"
    # env is declared explicitly so moon forwards parent-process
    # values to the task. Without this declaration, moon's default
    # task-env policy strips unknown vars; DOTS_NIX_SYSTEM (set by
    # `dots apply`) never reaches the bash subshell, the `nix eval`
    # fallback fires, and on a host where moon also stripped PATH
    # entries that find nix the fallback empties out — exactly what
    # v0.4.4 was supposed to prevent. The `$VAR` syntax interpolates
    # the parent's env at task-spawn time.
    env:
      DOTS_NIX_SYSTEM: "$DOTS_NIX_SYSTEM"
      NH_SHOW_ACTIVATION_LOGS: "1"
    args:
      - "-c"
      # set -eu so any future `$(...)` substitution that fails or any
      # unset variable surfaces as a hard error instead of silently
      # propagating empty values into nh's -c (the v0.4.0..v0.4.4
      # incident class). pipefail is intentionally NOT set: nh writes
      # progress to stdout that may legitimately produce broken pipes.
      - |-
        set -eu
        sys="${DOTS_NIX_SYSTEM:-$(nix eval --raw --impure --expr 'builtins.currentSystem' 2>/dev/null || true)}"
        if [ -z "$sys" ]; then
          echo "modules:deploy: cannot resolve nix system identifier" >&2
          echo "  what: DOTS_NIX_SYSTEM is unset and 'nix eval' produced no output" >&2
          echo "  why:  moon's task env may have stripped DOTS_NIX_SYSTEM, and nix may not be on PATH for this subshell" >&2
          echo "  next: invoke via 'dots apply' (which sets DOTS_NIX_SYSTEM) and confirm 'dots --version' is >= 0.4.4" >&2
          exit 1
        fi
        exec nh home switch -c "${sys}" . -- \
          --impure --accept-flake-config
    deps:
      - "cli:doctor"
    local: true
    options:
      cache: false
      runFromWorkspaceRoot: true

  update:
    command: "nix flake update"
    local: true
    options:
      cache: false
      runFromWorkspaceRoot: true
