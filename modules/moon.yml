$schema: "https://moonrepo.dev/schemas/project.json"

type: configuration
language: bash

project:
  name: modules
  description: "Home Manager projection."

# ADR-0015: the activation path (dots apply → nh home switch) is
# dots-direct. Moon's only role here is the dev-side flake checks
# and the input-update helper below. The previous `modules:deploy`
# moon task and its scripts/deploy.sh helper were removed once the
# Go binary started invoking nh in-process; the moon layer was
# adding interpolation footguns and earning none of moon's caching
# or graph value for a linear two-step sequence.
tasks:
  check:
    command: "nix flake check --impure --accept-flake-config"
    inputs:
      - "@globs(configs)"
      - "/flake.nix"
      - "/flake.lock"
      - "/devenv.nix"
    options:
      runFromWorkspaceRoot: true

  update:
    command: "nix flake update"
    local: true
    options:
      cache: false
      runFromWorkspaceRoot: true
